{% extends "base.html" %}
{% block content %}
<!-- Background Animation Layer -->
<div class="charging-station-bg">
    <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        <!-- Night Sky / Gradient -->
        <defs>
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
            </linearGradient>
            <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
                <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        <!-- Floor/Ground -->
        <rect x="0" y="500" width="800" height="100" fill="#2d3436" />
        <line x1="0" y1="500" x2="800" y2="500" stroke="#00cec9" stroke-width="2" opacity="0.5" />

        <!-- Charging Station Station -->
        <g transform="translate(550, 300)">
            <rect x="0" y="0" width="60" height="200" rx="5" fill="#34495e" />
            <rect x="10" y="20" width="40" height="60" rx="2" fill="#00cec9" class="station-screen" />
            <circle cx="30" cy="180" r="5" fill="#2ecc71" class="status-light" />
        </g>

        <!-- EV Car -->
        <g transform="translate(200, 380)">
            <!-- Car Body -->
            <path d="M0,80 L250,80 L250,40 Q240,0 180,0 L80,0 Q10,0 0,40 Z" fill="#3498db" />
            <rect x="20" y="40" width="210" height="40" fill="#2980b9" />
            <!-- Wheels -->
            <circle cx="50" cy="80" r="25" fill="#2c3e50" stroke="#ecf0f1" stroke-width="2" />
            <circle cx="200" cy="80" r="25" fill="#2c3e50" stroke="#ecf0f1" stroke-width="2" />
            <!-- Headlight -->
            <path d="M240,45 L250,45 L250,55 L240,55 Z" fill="#f1c40f" class="headlight" />
        </g>

        <!-- Cable & Energy Flow -->
        <path id="cablePath" d="M570,400 C500,400 450,420 420,420" fill="none" stroke="#7f8c8d" stroke-width="4" />
        <circle r="3" fill="#00cec9" filter="url(#glow)">
            <animateMotion repeatCount="indefinite" dur="1.5s" path="M570,400 C500,400 450,420 420,420" />
        </circle>

        <!-- Battery Charging Indicator (Hologram style above car) -->
        <g transform="translate(100, -50)">
            <rect x="0" y="0" width="60" height="30" rx="3" fill="none" stroke="#2ecc71" stroke-width="2" />
            <rect x="2" y="2" width="0" height="26" rx="2" fill="#2ecc71" opacity="0.8">
                <animate attributeName="width" from="0" to="56" dur="2s" repeatCount="indefinite" />
            </rect>
            <rect x="62" y="10" width="4" height="10" fill="#2ecc71" />
        </g>
    </svg>
</div>

<div class="row justify-content-center align-items-center" style="min-height: 80vh; position: relative; z-index: 1;">
    <div class="col-md-8 text-center">
        <div class="glass-card p-5">
            <h1 class="display-4 fw-bold mb-3">Smart EV Charging Station</h1>
            <p class="lead mb-4">Efficient, Optimized, and Real-time charging management.</p>
            <hr class="my-4">
            <p class="mb-4">Book your slot now and help us balance the grid.</p>
            <a class="btn btn-primary btn-lg px-5 py-3 rounded-pill" href="{{ url_for('auth.login') }}" role="button">
                <i class="bi bi-lightning-charge-fill"></i> Get Started
            </a>
        </div>
    </div>
</div>
{% endblock %}
